program: "Cybergrok Security Assessment & Bug Bounty"
authorization: "RESTRICTED"
dynamic_target_override: false
allow_ips: false

# Fail-closed: only these hosts may be probed/crawled.
# Add the operator-approved engagement hostname before an assessment.
in_scope:
  - "127.0.0.1:8888"
  - "localhost:8888"
  - "http://127.0.0.1:8888"
  - "http://localhost:8888"

out_of_scope:
  - "169.254.169.254"
  - "metadata.google.internal"

scope_rule: "Only hosts listed under in_scope are authorized. A model-chosen URL is not authorization."

testing_accounts:
  - role: "standard_user"
    username: "researcher_user_a"
    token_env: "USER_A_TOKEN"
  - role: "secondary_user"
    username: "researcher_user_b"
    token_env: "USER_B_TOKEN"

allowed:
  reconnaissance: true
  endpoint_discovery: true
  parameter_fuzzing: true
  vulnerability_testing: true
  authenticated_testing: true
  exploit_validation: true
  poc_generation: true
  browser_automation: true

restricted:
  destructive_actions: true
  denial_of_service: true
  persistence_creation: true
  credential_theft: true
  unrelated_target_access: true
  mass_targeting: true
  data_destruction: true
