[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybergrok"
version = "0.1.0"
description = "Autonomous offensive security plugin for Grok Build"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Kenny Dizi" }]
dependencies = [
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "playwright>=1.49.0",
    "rich>=13.9.4",
    "markdown>=3.7",
    "jinja2>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "basedpyright>=1.29,<2",
]

[project.scripts]
smart_pipe = "cybergrok.cli:main_smart_pipe"
secret_scan = "cybergrok.cli:main_secret_scan"
search_knowledge = "cybergrok.cli:main_search_knowledge"
aggregate_reports = "cybergrok.cli:main_aggregate_reports"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
cybergrok = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

# --- Ruff (lint + format) ---
# First-party only. Vendored knowledge/ and venvs are out of scope.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["python"]
extend-exclude = [
    "knowledge",
    "venv",
    ".venv",
    ".grok",
    "reports",
    "recon",
    "output",
    "logs",
    "targets",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "A",      # builtins shadowing
    "C4",     # comprehensions
    "C90",    # mccabe complexity
    "ASYNC",  # async pitfalls
    "S",      # flake8-bandit
    "BLE",    # blind except
    "FA",     # future annotations
    "T10",    # debugger
    "ICN",    # import conventions
    "LOG",    # logging
    "G",      # logging format
    "INP",    # implicit namespace packages
    "PIE",    # flake8-pie
    "PYI",    # typing stubs
    "PT",     # pytest style
    "Q",      # quotes
    "RSE",    # raise
    "RET",    # return
    "SLF",    # private member access
    "SLOT",   # slots
    "SIM",    # simplify
    "TID",    # tidy imports
    "TC",     # type-checking blocks
    "ARG",    # unused arguments
    "PTH",    # pathlib
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "TRY",    # tryceratops
    "PERF",   # perflint
    "FURB",   # refurb
    "RUF",    # ruff
]
ignore = [
    "E501",      # formatter owns line length
    "D",         # no pydocstyle mandate
    "COM812",    # conflicts with ruff format
    "ISC001",    # conflicts with ruff format
    "PLR0913",   # CLI/RPC handlers take many args by design
    "TRY003",    # exception messages inline is fine for this codebase
    "TRY300",    # try/else is optional style
    "TC003",     # files use from __future__ import annotations
    "N818",      # established names (UnsafeURL, ScopeError)
]

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ruff.lint.isort]
known-first-party = ["cybergrok"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 12
max-branches = 16
max-returns = 12
max-statements = 70

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = [
    "S101",    # asserts are the test
    "S105",    # dummy secrets in fixtures
    "S106",
    "S107",
    "S108",    # dummy /tmp paths in assertions
    "ARG001",  # unused fixtures
    "PLR2004", # magic values in assertions
    "SLF001",
    "PLC0415",
]
# Remaining bandit hits are the intended mechanism (urllib after netguard,
# resolved httpx binary, wrap process replacement) — not unused APIs.
"python/cybergrok/wrap.py" = ["S606"]
"python/cybergrok/probe.py" = ["S310", "S603"]
"python/cybergrok/crawl.py" = ["S310"]
"tools/**/*.py" = [
    "T201", "INP001", "S603", "S607", "S310", "S102", "S103", "S110", "S605",
    "BLE001", "C901", "PLR", "PLW", "PTH", "PLC0415", "E402", "SIM105", "ARG001", "UP036", "W293",
]
"scripts/**/*.py" = [
    "T201", "INP001", "S603", "S607", "BLE001", "PTH123", "ARG001", "C901", "PLR", "E402",
]
"examples/**/*.py" = ["T201", "INP001", "S104", "S310", "A002", "ARG001"]
"**/__main__.py" = ["T201"]

# --- ty (type checker) ---

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"
root = ["python"]

[tool.ty.src]
include = ["python"]
exclude = [
    "knowledge",
    "venv",
    ".venv",
    ".grok",
    "reports",
    "recon",
    "output",
    "logs",
    "targets",
    "tools",
    "scripts",
    "examples",
]

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true
output-format = "full"

[[tool.ty.overrides]]
include = ["python/tests/**", "tools/**", "scripts/**", "examples/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"

# --- basedpyright (IDE + CI, recommended mode) ---
# Same first-party trees as ruff. Vendored knowledge/ stays out.

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "All"
extraPaths = ["python"]
include = ["python", "tools", "scripts", "examples"]
exclude = [
    "knowledge",
    "venv",
    ".venv",
    ".grok",
    "reports",
    "recon",
    "output",
    "logs",
    "targets",
    "**/__pycache__",
]
